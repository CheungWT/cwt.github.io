name: Deploy Wikitext Site

on:
  push:
    branches: [ main ]  # 如果你的預設分支是 master，這裡請改成 master

permissions:
  contents: write      # 給予部署套件寫入 gh-pages 分支的權限

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 雲端執行 build.js 轉換 Wikitext
        run: node build.js

      - name: 發布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
